<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Debate</title>
    <link rel="stylesheet" th:href="@{/css/human-debate.css}">
</head>

<body>

<div class="debate-header">

    <div class="header-left">
        <a href="/create-room" class="back-btn">← Back</a>

        <div class="header-title">
            <span>👥</span> Human Debate
        </div>
    </div>

    <div class="header-right">
        <div>
            Room:
            <span id="displayRoomId" class="room-code">Loading...</span>
        </div>

        <div>
            Players:
            <span id="displayPlayers" class="player-count">1/2</span>
        </div>

        <div>
            Stance:
            <span id="displayStance" class="stance-badge">—</span>
        </div>
    </div>

</div>


<div class="main-content">

    <div id="topicTitle" class="topic-banner">
        Topic: Loading...
    </div>


    <div id="chatBox" class="chat-container">

        <div id="waitingOverlay" class="waiting-overlay">

            <div class="waiting-card">

                <h2 id="waitingTopic">
                    Topic: Loading...
                </h2>

                <h3 id="waitingStance">
                    Your Stance: Loading...
                </h3>

                <div class="waiting-spinner"></div>

                <p>
                    Waiting for the opponent to join...
                </p>

            </div>

        </div>

    </div>


    <div class="control-bar">

        <input
            type="text"
            id="messageInput"
            class="message-input"
            placeholder="Type or speak message"
            autocomplete="off">

        <button
            id="sendBtn"
            class="send-btn"
            onclick="sendMessage()">
            Send
        </button>

        <button
            id="micBtn"
            class="speak-btn"
            onclick="toggleSpeechRecognition()">
            🎤 Speak
        </button>

        <button
            id="ttsToggleBtn"
            class="tts-btn"
            onclick="toggleVoice()"
            title="Toggle Opponent Voice">
            🔊
        </button>

    </div>


    <div class="end-btn-wrapper">

        <button
            id="endDebateBtn"
            class="end-btn"
            onclick="handleEndDebate()">
            🚨 End Debate
        </button>

    </div>

</div>


<div
    id="resultModal"
    class="result-modal"
    style="display:none;">

    <div class="result-card">

        <h2 id="resultWinner">
            🏆 Winner
        </h2>

        <p id="resultReason">
            Debate concluded successfully.
        </p>

        <button
            class="send-btn"
            onclick="window.location.href='/dashboard'">
            Return to Dashboard
        </button>

    </div>

</div>


<div
    id="stanceModal"
    class="result-modal"
    style="display:none; z-index:9999;">

    <div
        class="result-card"
        style="text-align:center;">

        <h2>
            Your Assigned Stance
        </h2>

        <p
            id="stanceModalText"
            style="font-size:1.5rem; margin:20px 0; font-weight:bold;">
        </p>

        <button
            class="send-btn"
            onclick="document.getElementById('stanceModal').style.display='none'">
            Got it!
        </button>

    </div>

</div>


<script>

const params =
    new URLSearchParams(window.location.search);

const roomId =
    params.get("roomId") || "";

let username =
    params.get("username") ||
    localStorage.getItem("username") ||
    "Debater";

let currentStance =
    params.get("stance") || "unknown";

let socket = null;

let isDebateEnded = false;

let myWordCount = 0;

let opponentWordCount = 0;

let voiceEnabled = true;

let recognition = null;

let isRecording = false;


if (username.includes("@")) {
    username = username.split("@")[0];
}

localStorage.setItem("username", username);


document.getElementById("displayRoomId").innerText =
    roomId || "Unknown";


function updateStanceUI() {

    const badge =
        document.getElementById("displayStance");

    const waiting =
        document.getElementById("waitingStance");


    if (currentStance === "against") {

        badge.innerText =
            "Against the Motion";

        badge.style.color =
            "#f87171";

        waiting.innerHTML =
            `Your Stance:
            <span class="against-stance">
                Against the Motion 👎
            </span>`;

    } else if (currentStance === "for") {

        badge.innerText =
            "In Motion (For)";

        badge.style.color =
            "#86efac";

        waiting.innerHTML =
            `Your Stance:
            <span class="for-stance">
                In Motion (For) 👍
            </span>`;

    } else {

        badge.innerText =
            "Waiting...";

        waiting.innerText =
            "Your Stance: Waiting...";
    }
}


updateStanceUI();


function showStancePopup() {

    if (currentStance === "unknown") {
        return;
    }

    const text =
        document.getElementById("stanceModalText");


    if (currentStance === "against") {

        text.innerHTML =
            `<span style="color:#f87171">
                Against the Motion 👎
            </span>`;

    } else {

        text.innerHTML =
            `<span style="color:#86efac">
                In Motion (For) 👍
            </span>`;
    }


    document.getElementById(
        "stanceModal"
    ).style.display = "flex";
}


function initWebSocket() {

    if (!roomId) {

        appendSystemMessage(
            "Invalid room ID."
        );

        return;
    }


    const protocol =
        window.location.protocol === "https:"
            ? "wss:"
            : "ws:";


    const wsUrl =
        `${protocol}//${window.location.host}/ws-debate`;


    socket =
        new WebSocket(wsUrl);


    socket.onopen =
        function() {

            socket.send(
                JSON.stringify({

                    type: "JOIN",

                    roomId: roomId,

                    username: username,

                    stance: currentStance
                })
            );
        };


    socket.onmessage =
        function(event) {

            try {

                const data =
                    JSON.parse(event.data);

                handleServerEvent(data);

            } catch (error) {

                console.error(error);
            }
        };


    socket.onerror =
        function(error) {

            console.error(
                "WebSocket error:",
                error
            );

            appendSystemMessage(
                "Connection error."
            );
        };


    socket.onclose =
        function() {

            if (!isDebateEnded) {

                appendSystemMessage(
                    "Disconnected from room."
                );
            }
        };
}


function handleServerEvent(data) {

    if (data.type === "JOINED") {

        appendSystemMessage(
            `${data.username} joined`
        );


        if (
            currentStance === "unknown" &&
            data.username !== username &&
            data.stance &&
            data.stance !== "unknown"
        ) {

            currentStance =
                data.stance === "for"
                    ? "against"
                    : "for";

            updateStanceUI();

            showStancePopup();
        }


        if (data.topic) {

            document.getElementById(
                "topicTitle"
            ).innerText =
                `Topic: ${data.topic}`;

            document.getElementById(
                "waitingTopic"
            ).innerText =
                `Topic: ${data.topic}`;
        }


        if (
            data.playerCount !== undefined
        ) {

            document.getElementById(
                "displayPlayers"
            ).innerText =
                `${data.playerCount}/2`;


            if (data.playerCount === 2) {

                document.getElementById(
                    "waitingOverlay"
                ).style.display = "none";

            } else {

                document.getElementById(
                    "waitingOverlay"
                ).style.display = "flex";
            }
        }
    }


    else if (data.type === "LEFT") {

        appendSystemMessage(
            `${data.username} left the debate`
        );


        if (
            data.playerCount !== undefined
        ) {

            document.getElementById(
                "displayPlayers"
            ).innerText =
                `${data.playerCount}/2`;
        }
    }


    else if (data.type === "CHAT") {

        const isMe =
            data.username === username;


        const bubble =
            document.createElement("div");


        if (isMe) {

            bubble.className =
                "chat-bubble bubble-user";

            bubble.innerText =
                `You: ${data.message}`;

            myWordCount +=
                countWords(data.message);

        } else {

            bubble.className =
                "chat-bubble bubble-opponent";

            bubble.innerText =
                `${data.username}: ${data.message}`;

            opponentWordCount +=
                countWords(data.message);

            speakText(data.message);
        }


        document.getElementById(
            "chatBox"
        ).appendChild(bubble);


        scrollChat();
    }


    else if (data.type === "ENDED") {

        isDebateEnded = true;

        disableDebate();

        showResultModal(
            data.winner,
            data.reason
        );
    }


    else if (data.type === "ERROR") {

        alert(
            data.message ||
            "Something went wrong."
        );
    }
}


function sendMessage() {

    if (isDebateEnded) {

        alert(
            "This debate has ended."
        );

        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify({

                type: "CHAT",

                roomId: roomId,

                username: username,

                message: text
            })
        );

        input.value = "";

    } else {

        alert(
            "WebSocket is not connected."
        );
    }
}


document
    .getElementById("messageInput")
    .addEventListener(
        "keypress",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendMessage();
            }
        }
    );


function handleEndDebate() {

    if (isDebateEnded) {
        return;
    }


    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {

        alert(
            "WebSocket is not connected."
        );

        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to end this debate?"
        );


    if (!confirmed) {
        return;
    }


    let winner =
        "DRAW";

    let reason =
        "Both debaters presented strong arguments.";


    if (myWordCount > opponentWordCount) {

        winner =
            username;

        reason =
            `${username} presented longer and more detailed arguments.`;

    } else if (
        opponentWordCount > myWordCount
    ) {

        winner =
            "Opponent";

        reason =
            "The opponent presented longer and more detailed arguments.";
    }


    socket.send(
        JSON.stringify({

            type: "END_DEBATE",

            roomId: roomId,

            username: username,

            winner: winner,

            reason: reason
        })
    );
}


function showResultModal(
    winner,
    reason
) {

    document.getElementById(
        "resultWinner"
    ).innerText =
        `🏆 Winner: ${winner}`;


    document.getElementById(
        "resultReason"
    ).innerText =
        reason || "Debate completed.";


    document.getElementById(
        "resultModal"
    ).style.display =
        "flex";
}


function disableDebate() {

    document.getElementById(
        "messageInput"
    ).disabled = true;


    document.getElementById(
        "sendBtn"
    ).disabled = true;


    document.getElementById(
        "micBtn"
    ).disabled = true;


    document.getElementById(
        "endDebateBtn"
    ).disabled = true;


    document.getElementById(
        "displayPlayers"
    ).innerText += " • Completed";
}


function appendSystemMessage(text) {

    const chatBox =
        document.getElementById(
            "chatBox"
        );


    const message =
        document.createElement("div");


    message.className =
        "system-msg";


    message.innerText =
        text;


    chatBox.appendChild(message);


    scrollChat();
}


function scrollChat() {

    const chatBox =
        document.getElementById(
            "chatBox"
        );


    chatBox.scrollTop =
        chatBox.scrollHeight;
}


function countWords(text) {

    if (!text) {
        return 0;
    }

    return text
        .trim()
        .split(/\s+/)
        .length;
}


const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.lang =
        "en-US";


    recognition.onstart =
        function() {

            isRecording = true;

            document.getElementById(
                "micBtn"
            ).innerText =
                "🔴 Listening...";
        };


    recognition.onresult =
        function(event) {

            const transcript =
                event.results[0][0].transcript;


            const input =
                document.getElementById(
                    "messageInput"
                );


            input.value +=
                (
                    input.value
                        ? " "
                        : ""
                ) + transcript;
        };


    recognition.onerror =
        function() {

            stopRecordingUI();
        };


    recognition.onend =
        function() {

            stopRecordingUI();
        };
}


function toggleSpeechRecognition() {

    if (!recognition) {

        alert(
            "Speech recognition is not supported. Use Chrome or Edge."
        );

        return;
    }


    if (isDebateEnded) {
        return;
    }


    if (isRecording) {

        recognition.stop();

    } else {

        recognition.start();
    }
}


function stopRecordingUI() {

    isRecording = false;


    document.getElementById(
        "micBtn"
    ).innerText =
        "🎤 Speak";
}


function toggleVoice() {

    voiceEnabled =
        !voiceEnabled;


    const button =
        document.getElementById(
            "ttsToggleBtn"
        );


    if (voiceEnabled) {

        button.innerText =
            "🔊";

    } else {

        button.innerText =
            "🔈";

        window.speechSynthesis.cancel();
    }
}


function speakText(text) {

    if (!voiceEnabled) {
        return;
    }


    if (!window.speechSynthesis) {
        return;
    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "en-US";


    window.speechSynthesis.speak(
        utterance
    );
}


window.addEventListener(
    "load",
    function() {

        updateStanceUI();

        initWebSocket();

    }
);

</script>

</body>
</html>
