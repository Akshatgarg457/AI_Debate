<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Debate</title>
    <link rel="stylesheet" href="/css/human-debate.css">
</head>

<body>

<div class="debate-header">

    <div class="header-left">
        <a href="/create-room" class="back-btn">← Back</a>

        <div class="header-title">
            <span>👥</span> Human Debate
        </div>
    </div>

    <div class="header-right">
        <div>
            Room:
            <span id="displayRoomId" class="room-code">Loading...</span>
        </div>

        <div>
            Players:
            <span id="displayPlayers" class="player-count">1/2</span>
        </div>

        <div>
            Stance:
            <span id="displayStance" class="stance-badge">—</span>
        </div>
    </div>

</div>


<div class="main-content">

    <div id="topicTitle" class="topic-banner">
        Topic: Loading...
    </div>


    <div id="chatBox" class="chat-container">

        <div id="waitingOverlay" class="waiting-overlay">

            <div class="waiting-card">

                <h2 id="waitingTopic">
                    Topic: Loading...
                </h2>

                <h3 id="waitingStance">
                    Your Stance: Loading...
                </h3>

                <div class="waiting-spinner"></div>

                <p>
                    Waiting for the opponent to join...
                </p>

            </div>

        </div>

    </div>


    <div class="control-bar">

        <input
            type="text"
            id="messageInput"
            class="message-input"
            placeholder="Type or speak message"
            autocomplete="off">

        <button
            id="sendBtn"
            class="send-btn"
            onclick="sendMessage()">
            Send
        </button>

        <button
            id="micBtn"
            class="speak-btn"
            onclick="toggleSpeechRecognition()">
            🎤 Speak
        </button>

        <button
            id="ttsToggleBtn"
            class="tts-btn"
            onclick="toggleVoice()"
            title="Toggle Opponent Voice">
            🔊
        </button>

    </div>


    <div class="end-btn-wrapper">

        <button
            id="endDebateBtn"
            class="end-btn"
            onclick="handleEndDebate()">
            🚨 End Debate
        </button>

    </div>

</div>


<div
    id="resultModal"
    class="result-modal"
    style="display:none;">

    <div class="result-card">

        <h2 id="resultWinner">
            🏆 Winner
        </h2>

        <p id="resultReason">
            Debate concluded successfully.
        </p>

        <button
            class="send-btn"
            onclick="window.location.href='/dashboard'">
            Return to Dashboard
        </button>

    </div>

</div>


<div
    id="stanceModal"
    class="result-modal"
    style="display:none; z-index:9999;">

    <div
        class="result-card"
        style="text-align:center;">

        <h2>
            Your Assigned Stance
        </h2>

        <p
            id="stanceModalText"
            style="font-size:1.5rem; margin:20px 0; font-weight:bold;">
        </p>

        <button
            class="send-btn"
            onclick="document.getElementById('stanceModal').style.display='none'">
            Got it!
        </button>

    </div>

</div>

<script src="/js/human-debate.js"></script>

</body>
</html>
