<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>History</title>
    <link rel="stylesheet" th:href="@{/css/history.css}" />
</head>
<body>
    <div class="header">
        <a href="/dashboard" class="back-btn">← RETURN TO DASHBOARD</a>
        <div class="user-section">
            <span id="usernameDisplay"></span>
            <a href="/" class="logout-btn">Logout</a>
        </div>
    </div>
    <div class="container">
        <h1 class="title">Your Debate History</h1>
        <div id="history-grid" class="history-grid"></div>
    </div>
    <script>
        // Username handling (same as dashboard)
        let username = localStorage.getItem("username");
        if (username) {
            if (username.includes("@")) username = username.split("@")[0];
            username = username.charAt(0).toUpperCase() + username.slice(1);
        } else { username = "User"; }
        document.getElementById("usernameDisplay").innerText = "👋 " + username;
        function loadHistory() {
            fetch(`/history?username=${username}`).then(r => r.json()).then(historyData => {
                const totalCards = Math.ceil((historyData.length + 3) / 3) * 3;
                const emptyCount = totalCards - historyData.length;
                const allData = historyData.concat(Array(emptyCount).fill(null));
                const grid = document.getElementById('history-grid');
                grid.innerHTML = '';
                allData.forEach(d => {
                    const card = document.createElement('div');
                    card.className = d ? 'history-card' : 'history-card empty';
                    if (d) {
                        const inner = `
                            <h3 class="card-title">${d.topic}</h3>
                            <p><strong>Winner:</strong> ${d.winner}</p>
                            ${d.result ? `<p><strong>Result:</strong> ${d.result}</p>` : ''}
                            ${d.score ? `<p><strong>Score:</strong> ${d.score}</p>` : ''}
                            <p class="date">${new Date(d.createdAt || Date.now()).toLocaleString()}</p>
                            <a href="/debate?uid=${d.id}" class="view-btn">VIEW DEBATE →</a>
                        `;
                        card.innerHTML = inner;
                    } else {
                        card.innerHTML = `<p class="empty-text">EMPTY SLOT</p><p class="empty-sub">Available for your next debate</p>`;
                    }
                    grid.appendChild(card);
                });
            });
        }
        loadHistory();
    </script>
</body>
</html>
